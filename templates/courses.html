<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Courses</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-100 min-h-screen"><div class="max-w-6xl mx-auto px-6 py-10"><div class="flex justify-between mb-8"><h1 class="text-3xl font-bold">Courses</h1><a href="/dashboard" class="text-blue-600">Dashboard</a></div><div class="bg-white rounded-xl shadow-sm p-6 mb-8"><h2 class="text-xl font-semibold mb-5">Add Course</h2><form action="/courses" method="POST" class="grid md:grid-cols-3 gap-4"><input type="text" name="name" placeholder="Course name" required class="border rounded-lg px-4 py-3"><select name="teacher_id" required class="border rounded-lg px-4 py-3"><option value="">Select Teacher</option>{% for teacher in teachers %}<option value="{{ teacher[0] }}">{{ teacher[1] }}</option>{% endfor %}</select><button class="bg-purple-600 text-white rounded-lg">Add Course</button></form></div><div class="bg-white rounded-xl shadow-sm overflow-hidden"><table class="w-full"><thead class="bg-gray-50"><tr><th class="text-left px-6 py-4">ID</th><th class="text-left px-6 py-4">Course</th><th class="text-left px-6 py-4">Teacher</th></tr></thead><tbody class="divide-y">{% for course in courses %}<tr><td class="px-6 py-4">{{ course[0] }}</td><td class="px-6 py-4 font-medium">{{ course[1] }}</td><td class="px-6 py-4">{{ course[2] if course[2] else 'No teacher assigned' }}</td></tr>{% endfor %}</tbody></table></div></div></body></html>
