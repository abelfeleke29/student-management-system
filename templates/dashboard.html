<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-100 min-h-screen"><nav class="bg-white shadow-sm"><div class="max-w-6xl mx-auto px-6 py-4 flex justify-between"><h1 class="text-xl font-bold">Student Management System</h1><a href="/logout" class="text-red-600">Logout</a></div></nav><main class="max-w-6xl mx-auto px-6 py-10"><h2 class="text-3xl font-bold text-gray-800">Welcome, {{ username }}</h2><p class="text-gray-500 mt-2">Manage students, teachers, courses and enrollments.</p><div class="grid md:grid-cols-4 gap-6 mt-8"><div class="bg-white rounded-xl shadow-sm p-6"><p class="text-gray-500">Students</p><p class="text-3xl font-bold mt-2">{{ student_count }}</p></div><div class="bg-white rounded-xl shadow-sm p-6"><p class="text-gray-500">Teachers</p><p class="text-3xl font-bold mt-2">{{ teacher_count }}</p></div><div class="bg-white rounded-xl shadow-sm p-6"><p class="text-gray-500">Courses</p><p class="text-3xl font-bold mt-2">{{ course_count }}</p></div><div class="bg-white rounded-xl shadow-sm p-6"><p class="text-gray-500">Enrollments</p><p class="text-3xl font-bold mt-2">{{ enrollment_count }}</p></div></div><div class="grid md:grid-cols-4 gap-4 mt-8"><a href="/students" class="bg-blue-600 text-white p-5 rounded-xl">Students</a><a href="/teachers" class="bg-green-600 text-white p-5 rounded-xl">Teachers</a><a href="/courses" class="bg-purple-600 text-white p-5 rounded-xl">Courses</a><a href="/enrollments" class="bg-orange-600 text-white p-5 rounded-xl">Enrollments</a></div></main></body></html>
