<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Student</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-100 min-h-screen"><div class="max-w-xl mx-auto px-6 py-10"><div class="bg-white rounded-xl shadow-sm p-8"><h1 class="text-2xl font-bold mb-6">Edit Student</h1><form action="/students/edit/{{ student[0] }}" method="POST"><label class="block font-medium mb-2">Student Name</label><input type="text" name="name" value="{{ student[1] }}" required class="w-full border rounded-lg px-4 py-3 mb-5"><label class="block font-medium mb-2">Age</label><input type="number" name="age" value="{{ student[2] }}" min="1" required class="w-full border rounded-lg px-4 py-3 mb-6"><div class="flex gap-3"><button class="bg-blue-600 text-white px-6 py-3 rounded-lg">Update Student</button><a href="/students" class="bg-gray-500 text-white px-6 py-3 rounded-lg">Cancel</a></div></form></div></div></body></html>
