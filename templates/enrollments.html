<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Enrollments</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-100 min-h-screen"><div class="max-w-6xl mx-auto px-6 py-10"><div class="flex justify-between mb-8"><h1 class="text-3xl font-bold">Enrollments</h1><a href="/dashboard" class="text-blue-600">Dashboard</a></div><div class="bg-white rounded-xl shadow-sm p-6 mb-8"><h2 class="text-xl font-semibold mb-5">Enroll Student</h2><form action="/enrollments" method="POST" class="grid md:grid-cols-3 gap-4"><select name="student_id" required class="border rounded-lg px-4 py-3"><option value="">Select Student</option>{% for student in students %}<option value="{{ student[0] }}">{{ student[1] }}</option>{% endfor %}</select><select name="course_id" required class="border rounded-lg px-4 py-3"><option value="">Select Course</option>{% for course in courses %}<option value="{{ course[0] }}">{{ course[1] }}</option>{% endfor %}</select><button class="bg-orange-600 text-white rounded-lg">Enroll Student</button></form></div><div class="bg-white rounded-xl shadow-sm overflow-hidden"><table class="w-full"><thead class="bg-gray-50"><tr><th class="text-left px-6 py-4">ID</th><th class="text-left px-6 py-4">Student</th><th class="text-left px-6 py-4">Course</th><th class="text-left px-6 py-4">Date</th></tr></thead><tbody class="divide-y">{% for enrollment in enrollments %}<tr><td class="px-6 py-4">{{ enrollment[0] }}</td><td class="px-6 py-4 font-medium">{{ enrollment[1] }}</td><td class="px-6 py-4">{{ enrollment[2] }}</td><td class="px-6 py-4">{{ enrollment[3] }}</td></tr>{% endfor %}</tbody></table></div></div></body></html>
