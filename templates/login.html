<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center"><div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8"><h1 class="text-3xl font-bold text-gray-800">Login</h1><p class="text-gray-500 mt-2 mb-6">Student Management System</p>{% if error %}<div class="bg-red-100 text-red-700 p-3 rounded-lg mb-5">{{ error }}</div>{% endif %}<form action="/login" method="POST"><label class="block text-sm font-medium mb-2">Email</label><input type="email" name="email" required class="w-full border rounded-lg px-4 py-3 mb-5"><label class="block text-sm font-medium mb-2">Password</label><input type="password" name="password" required class="w-full border rounded-lg px-4 py-3 mb-6"><button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold">Login</button></form><p class="text-center text-gray-500 mt-6">Don't have an account? <a href="/register" class="text-blue-600 font-medium">Register</a></p></div></body></html>
