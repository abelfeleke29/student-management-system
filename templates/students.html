<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Students</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-100 min-h-screen"><div class="max-w-6xl mx-auto px-6 py-10"><div class="flex justify-between items-center mb-8"><div><h1 class="text-3xl font-bold">Students</h1><p class="text-gray-500">Manage student records</p></div><a href="/dashboard" class="text-blue-600">Dashboard</a></div><div class="bg-white rounded-xl shadow-sm p-6 mb-6"><form action="/students/search" method="GET" class="flex gap-3"><input type="text" name="keyword" value="{{ keyword if keyword else '' }}" placeholder="Search student..." class="flex-1 border rounded-lg px-4 py-3"><button class="bg-gray-800 text-white px-6 rounded-lg">Search</button></form></div><div class="mb-6"><a href="/students/add" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg">+ Add Student</a></div><div class="bg-white rounded-xl shadow-sm overflow-hidden"><table class="w-full"><thead class="bg-gray-50"><tr><th class="text-left px-6 py-4">ID</th><th class="text-left px-6 py-4">Name</th><th class="text-left px-6 py-4">Age</th><th class="text-left px-6 py-4">Actions</th></tr></thead><tbody class="divide-y">{% for student in students %}<tr><td class="px-6 py-4">{{ student[0] }}</td><td class="px-6 py-4 font-medium">{{ student[1] }}</td><td class="px-6 py-4">{{ student[2] }}</td><td class="px-6 py-4"><div class="flex gap-2"><a href="/students/edit/{{ student[0] }}" class="bg-blue-600 text-white px-4 py-2 rounded-lg">Edit</a><form action="/students/delete/{{ student[0] }}" method="POST"><button type="submit" onclick="return confirm('Delete this student?')" class="bg-red-600 text-white px-4 py-2 rounded-lg">Delete</button></form></div></td></tr>{% else %}<tr><td colspan="4" class="text-center py-10 text-gray-500">No students found.</td></tr>{% endfor %}</tbody></table></div></div></body></html>
