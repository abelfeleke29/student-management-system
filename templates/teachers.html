<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Teachers</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-100 min-h-screen"><div class="max-w-6xl mx-auto px-6 py-10"><div class="flex justify-between mb-8"><h1 class="text-3xl font-bold">Teachers</h1><a href="/dashboard" class="text-blue-600">Dashboard</a></div><div class="bg-white rounded-xl shadow-sm p-6 mb-8"><h2 class="text-xl font-semibold mb-5">Add Teacher</h2><form action="/teachers" method="POST" class="grid md:grid-cols-3 gap-4"><input type="text" name="name" placeholder="Teacher name" required class="border rounded-lg px-4 py-3"><input type="email" name="email" placeholder="Email" class="border rounded-lg px-4 py-3"><button class="bg-green-600 text-white rounded-lg">Add Teacher</button></form></div><div class="bg-white rounded-xl shadow-sm overflow-hidden"><table class="w-full"><thead class="bg-gray-50"><tr><th class="text-left px-6 py-4">ID</th><th class="text-left px-6 py-4">Name</th><th class="text-left px-6 py-4">Email</th></tr></thead><tbody class="divide-y">{% for teacher in teachers %}<tr><td class="px-6 py-4">{{ teacher[0] }}</td><td class="px-6 py-4">{{ teacher[1] }}</td><td class="px-6 py-4">{{ teacher[2] }}</td></tr>{% endfor %}</tbody></table></div></div></body></html>
